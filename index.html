<body>
  <canvas class="particle-canvas" aria-hidden="true"></canvas>
  <div class="geo-layer" aria-hidden="true">
    <span class="geo-scan scan-a"></span>
    <span class="geo-scan scan-b"></span>
    <span class="geo-orbit orbit-a"></span>
    <span class="geo-orbit orbit-b"></span>
    <span class="geo-orbit orbit-c"></span>
    <span class="geo-orbit orbit-d"></span>
    <span class="geo-diamond diamond-a"></span>
    <span class="geo-diamond diamond-b"></span>
    <span class="geo-diamond diamond-c"></span>
    <span class="geo-line line-a"></span>
    <span class="geo-line line-b"></span>
    <span class="geo-line line-c"></span>
    <span class="geo-line line-d"></span>
    <span class="geo-line line-e"></span>
    <span class="geo-grid grid-a"></span>
    <span class="geo-grid grid-b"></span>
    <span class="geo-grid grid-c"></span>
    <span class="geo-hex hex-a"></span>
    <span class="geo-hex hex-b"></span>
    <span class="geo-hex hex-c"></span>
    <span class="geo-target target-a"></span>
    <span class="geo-target target-b"></span>
    <span class="geo-code code-a">0101 / TRACE / MATRIX</span>
    <span class="geo-code code-b">HEX / NODE / SIGNAL</span>
    <span class="geo-code code-c">RENDER / FLOW / 01</span>

      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
        菜单

      <nav id="site-nav" class="site-nav">
        <a href="#modules">Modules</a>
      </nav>
    </header>

    <main class="home-layout">
      <section class="home-copy reveal">
        <p class="eyebrow">Archive</p>
        <h1>Levis blog</h1>

        <section id="modules" class="writing-block">
          <p class="eyebrow">Modules</p>
          <div class="module-list">
            <article class="module-item reveal">
              <a class="module-link" href="posts/test.html">
                <span class="module-name">Forensics</span>
                <span class="module-desc">测试文档</span>
              </a>
            </article>

            <article class="module-item reveal">
              <a class="module-link" href="posts/lwe.html">
                <span class="module-name">Crypto</span>
                <span class="module-desc">LWE</span>
              </a>
            </article>

            <article class="module-item reveal">
              <a class="module-link" href="posts/test.html">
                <span class="module-name">RE</span>
                <span class="module-desc">测试文档</span>
              </a>
            </article>
          </div>
        </section>
      </section>

      <aside class="home-figure reveal">
        <div class="floating-card">
          <p class="floating-label">Display</p>
          <div class="character-shell">
            <div class="character-glow"></div>
            <div class="character-portrait">
              <img class="character-image" src="assets/character.png" alt="Levis1 original character illustration">
              <div class="character-eye-overlay eye-left">
                <span class="character-eye-dot"></span>
              </div>
              <div class="character-eye-overlay eye-right">
                <span class="character-eye-dot"></span>
              </div>
            </div>
          </div>
        </div>
      </aside>
    </main>

    <footer class="site-footer reveal">
      <p>&copy; <span id="current-year"></span> Levis1</p>
      <p>Levis blog.</p>
    </footer>
